app = "pet-island-dde-ldn-2026"
primary_region = "lhr"

[env]
  PORT = "3000"
  COOKIE_SECURE = "true"
  MESSAGE_MODEL = "gpt-6-luna"

[deploy]
  strategy = "immediate"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
